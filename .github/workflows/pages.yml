name: 사이트 검사 및 Pages 배포

on:
  workflow_dispatch:
  schedule:
    # 매시 2분부터 10분 간격으로 실행해 동시 실행과 정각 혼잡을 피합니다.
    - cron: '2/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/status.json'
      - 'checker/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 브라우저 검사 도구 준비
        run: npm ci
      - name: 사이트 상태 검사
        env:
          PREVIOUS_STATUS_URL: https://wankyo83.github.io/tokki-traffic-light/status.json
          SERVICE_DELAY_MS: '20000'
          SITE_DELAY_MS: '3000'
          CANDIDATE_CONFIRMATIONS: '2'
          CHECK_INTERVAL_MINUTES: '10'
          DEBUG_CHECKS: 'true'
          BROWSER_FALLBACK: 'true'
          CHROME_PATH: /usr/bin/google-chrome
        run: node checker/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
