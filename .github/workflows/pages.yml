name: 사이트 검사 및 Pages 배포

on:
  workflow_dispatch:
  schedule:
    # 10분마다 실행합니다. 분 값을 명시해 스케줄러 해석 차이를 피합니다.
    - cron: '2,12,22,32,42,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/status.json'
      - 'checker/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 사이트 상태 검사
        env:
          PREVIOUS_STATUS_URL: https://wankyo83.github.io/tokki-traffic-light/status.json
          CHECK_INTERVAL_MINUTES: '10'
        run: node checker/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
