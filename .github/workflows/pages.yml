name: 사이트 검사 및 Pages 배포

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions의 최소 예약 간격인 5분마다 실행합니다.
    # 정각의 혼잡을 피하도록 매시 2분부터 시작합니다.
    - cron: '2/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/status.json'
      - 'checker/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 사이트 상태 검사
        run: node checker/check.mjs
      - name: 검사 결과 저장
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/status.json
          git diff --cached --quiet || git commit -m "chore: 사이트 상태 갱신"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
