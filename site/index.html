<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>토끼 신호등</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 96 96" role="img">
          <rect width="96" height="96" rx="26" fill="#172554"/>
          <rect x="26" y="10" width="44" height="76" rx="22" fill="#0b1229" stroke="#60a5fa" stroke-width="3"/>
          <circle cx="48" cy="30" r="9" fill="#ef4444"/><circle cx="48" cy="48" r="9" fill="#facc15"/><circle cx="48" cy="66" r="9" fill="#22c55e"/>
          <path d="M38 23c-9-7-12-15-8-18 5-3 12 7 14 16M58 23c9-7 12-15 8-18-5-3-12 7-14 16" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <h1>토끼 신호등</h1>
        <p>확장앱 최신 주소 관리 페이지</p>
      </div>
      <button id="refresh" type="button" aria-label="새로고침">↻</button>
    </header>

    <div class="meta">
      <span id="updated">검사 결과를 불러오는 중…</span>
      <span id="duration"></span>
    </div>

    <section class="summary" aria-label="검사 요약">
      <div><strong id="healthy-count">-</strong><span>정상</span></div>
      <div><strong id="stale-count">-</strong><span>보호 중</span></div>
      <div><strong id="down-count">-</strong><span>확인 필요</span></div>
    </section>

    <section class="status-section address-section">
      <h2><span>🚦</span> 확장앱이 사용하는 최신 주소</h2>
      <div id="addresses" class="rows"><div class="skeleton"></div></div>
    </section>

    <section class="status-section ok-section">
      <h2><span>✅</span> 정상 이용 가능</h2>
      <div id="available" class="rows"><div class="skeleton"></div></div>
    </section>

    <section class="status-section down-section">
      <h2><span>❌</span> 현재 이용 불가</h2>
      <div id="unavailable" class="rows"><div class="skeleton"></div></div>
    </section>

    <footer>
      <p>중앙 검사가 실패해도 확장앱에는 마지막으로 확인된 정상 주소가 유지됩니다.</p>
      <p>표시는 GitHub 검사 서버 기준이며 통신사·VPN·지역에 따라 실제 접속 결과가 다를 수 있습니다.</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
