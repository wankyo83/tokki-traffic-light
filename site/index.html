<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>토끼 신호등</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 96 96" role="img">
          <rect width="96" height="96" rx="26" fill="#172554"/>
          <rect x="26" y="10" width="44" height="76" rx="22" fill="#0b1229" stroke="#60a5fa" stroke-width="3"/>
          <circle cx="48" cy="30" r="9" fill="#ef4444"/><circle cx="48" cy="48" r="9" fill="#facc15"/><circle cx="48" cy="66" r="9" fill="#22c55e"/>
          <path d="M38 23c-9-7-12-15-8-18 5-3 12 7 14 16M58 23c9-7 12-15 8-18-5-3-12 7-14 16" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <h1>토끼 신호등</h1>
        <p>확장앱 최신 주소 확인 페이지</p>
      </div>
      <button id="refresh" type="button" aria-label="새로고침">↻</button>
    </header>

    <div id="freshness-warning" class="freshness-warning" role="status" hidden></div>

    <div class="meta">
      <span id="updated">마지막 주소 확인 결과를 불러오는 중…</span>
      <span id="updated-age"></span>
      <span id="duration"></span>
    </div>

    <section class="summary" aria-label="검사 요약">
      <div><strong id="healthy-count">-</strong><span>정상</span></div>
      <div><strong id="verifying-count">-</strong><span>확인 중</span></div>
      <div><strong id="blocked-count">-</strong><span>확인 실패</span></div>
    </section>

    <div class="address-grid">
      <section class="status-section address-section">
        <h2><span>📚</span> 만화·웹툰 신호등</h2>
        <div id="manga-addresses" class="rows"><div class="skeleton"></div></div>
      </section>

      <div class="center-divider" aria-hidden="true"></div>

      <section class="status-section address-section">
        <h2><span>🎬</span> 미디어 주소</h2>
        <div id="media-addresses" class="rows"><div class="skeleton"></div></div>
      </section>
    </div>

    <footer>
      <p>주소 출처에 연결하지 못해도 마지막으로 확인된 주소는 유지됩니다.</p>
      <p>NAS가 국내 회선의 Camoufox 브라우저로 안내처와 사이트 구조를 확인합니다. 인증이나 구조 확인에 실패한 후보는 공개 주소로 채택하지 않습니다.</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
